<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      background: repeating-linear-gradient(-40deg, 
        #f9a875 0px,
        #f9a875 10px,
        #fff6d3 10px,
        #fff6d3 20px);
    }

    .side-header {
      width: 200px;
      background-color: #f9a875;
      color: #7c3f58;
      height: 100vh;
      padding: 40px;
      position: fixed;
      left: 0;
      top: 0;
      font-family: myFont;
      font-size: 40px;
      box-shadow: 5px 5px 12px rgba(90, 37, 59, 0.3);
      line-height: 0.85;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .button {
      background-color: #7c3f58;
      color: #f9a875;
      border: none;
      width: 240px;
      padding: 20px 0px;
      margin-top: 20px;
      font-family: myFont;
      font-size: 25px;
      letter-spacing: 1.5px;
      border-radius: 60px;
      cursor: pointer;
    }

    @font-face {
      font-family: myFont;
      src: url(BebasNeue-Regular.ttf);
    }

    .post {
      margin-left: 300px;
      margin-right: 20px;
      font-family: "Montserrat", sans-serif;
      font-weight: 500;
      font-size: 20px;
      color: #7c3f52;
    }

    .rounded-square {
      display: inline-block;
      background-color: #fff6d3;
      border-radius: 40px;
      padding: 30px;
      margin-top: 20px;
      border: 3px solid #f9a875;
      box-shadow: 5px 5px 12px rgba(90, 37, 59, 0.3);
    }

    .rounded-square img {
      display: block;
      border-radius: 10px;
      width: 100%;
      max-width: 600px;
      height: auto;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <!-- Load PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Side header -->
  <header class="side-header">
    <h1 id="HEAD">GRAM.<br>WEBSITE</h1>
    <button onclick="RELODE()" class="button">HOME</button>
    <button onclick="ART_BUTTON()" class="button">ART</button>
    <button onclick="WRITING_BUTTON()" class="button">WRITING</button>
    <button onclick="GAMES_BUTTON()" class="button">GAMES</button>

  </header>
  <div id="post"></div>

  <script>
    let allPosts = [];
    const HEAD = document.getElementById("HEAD");
    // Load CSV data
    document.addEventListener('DOMContentLoaded', function () {
      const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmEkRx-2gjc5YM2BbuDtlWt-qORpsUvN6ZI_XeV2YEkcwH0GLvWRUkZLX-4C2IcX12owwHupO2ZJyg/pub?output=csv';

      Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function (results) {
          console.log('✅ Parsed data:', results.data);
          allPosts = results.data;
          renderPosts(allPosts); // Show all posts initially
        },
        error: function (err) {
          console.error('❌ PapaParse error:', err);
        }
      });
    });

    // Render posts
    function renderPosts(posts) {
      const postContainer = document.getElementById('post');
      postContainer.innerHTML = ''; // Clear existing posts

      posts.forEach(row => {
        if (!row.Image && !row.Text) return;

        const div = document.createElement('div');
        div.className = 'post';

        let content = `<div class="rounded-square">`;
        if (row.Image) {
          content += `<img src="${row.Image}" alt="Post image">`;
        }
        if (row.Text) {
          content += `<p>${row.Text}</p>`;
        }
        content += `</div>`;
        div.innerHTML = content;

        postContainer.appendChild(div);
      });
    }
    function RELODE() {
      window.location.reload(true);
    }
    // Button functions to filter content
    function ART_BUTTON() {
      HEAD.innerHTML = "GRAM.<br>ART"
      const filtered = allPosts.filter(row => row.Category.toUpperCase() === "ART");
      renderPosts(filtered);
    }

    function WRITING_BUTTON() {
      HEAD.innerHTML = "GRAM.<br>WRITING"
      const filtered = allPosts.filter(row => row.Category?.toUpperCase() === "WRITING");
      renderPosts(filtered);
    }

    function GAMES_BUTTON() {
      HEAD.innerHTML = "GRAM.<br>GAMES"
      const filtered = allPosts.filter(row => row.Category?.toUpperCase() === "GAMES");
      renderPosts(filtered);
    }
  </script>

</body>
</html>
